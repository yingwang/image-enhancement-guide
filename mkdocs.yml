site_name: 影像增强：从原理到工程 / Image Enhancement: From Principles to Engineering
site_description: 从退化模型 y = D(x) + n 出发，理解影像增强的第一性原理，掌握从 CNN/Transformer 到扩散模型的完整工程实践。
site_url: https://yingwang.github.io/image-enhancement-guide/
repo_url: https://github.com/yingwang/image-enhancement-guide
repo_name: yingwang/image-enhancement-guide
edit_uri: edit/main/

docs_dir: docs
site_dir: _site
use_directory_urls: true

theme:
  name: material
  language: zh
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - navigation.indexes
    - navigation.tracking
    - navigation.instant
    - navigation.instant.progress
    - toc.follow
    - search.highlight
    - search.share
    - search.suggest
    - content.code.copy
    - content.code.annotate
    - content.action.edit
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/yingwang

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - footnotes
  - tables
  - mdx_truly_sane_lists
  - toc:
      permalink: true
      permalink_title: 链接到此节
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

plugins:
  - search:
      lang:
        - en
        - zh

nav:
  - 首页: README.md
  - Part I · 基础:
    - 第 1 章 — 退化模型与逆问题: chapters/01-degradation-model.md
    - 第 2 章 — 像素、特征、潜空间: chapters/02-representation.md
    - 第 3 章 — 损失函数全景: chapters/03-losses.md
    - 第 4 章 — 评估的陷阱: chapters/04-metrics.md
    - 第 5 章 — 数据与退化合成: chapters/05-degradation-pipeline.md
  - Part II · 架构:
    - 第 6 章 — CNN 时代: chapters/06-cnn.md
    - 第 7 章 — Transformer 在低层视觉: chapters/07-transformer.md
    - 第 8 章 — 扩散模型基础: chapters/08-diffusion.md
    - 第 9 章 — 扩散的条件控制: chapters/09-control.md
    - 第 10 章 — 任务特化模型: chapters/10-task-specific.md
  - Part III · 训练与评估:
    - 第 11 章 — 训练稳定性: chapters/11-training.md
    - 第 12 章 — 评估方法论: chapters/12-evaluation.md

